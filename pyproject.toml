[project]
name = "eoc-llm-tooling-dotgithub"
version = "0.1.0"
description = "Default community files and label tooling of the eoc-llm-tooling organization"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = [
    "check-jsonschema",
    "mypy",
    "poethepoet>=0.48.0",
    "pytest",
    "ruff",
    "types-pyyaml",
]

[tool.uv]
package = false

# Task runner (poethepoet). Run with: `uv run poe <task>` (e.g. `uv run poe gate`).
[tool.poe.tasks]
lint = { cmd = "ruff check .", help = "Lint with ruff" }
format = { cmd = "ruff format .", help = "Auto-format with ruff" }
format-check = { cmd = "ruff format --check .", help = "Check formatting without writing changes" }
typecheck = { cmd = "mypy tools tests", help = "Type-check with mypy" }
test = { cmd = "pytest", help = "Run the tests" }
forms = { shell = "check-jsonschema --builtin-schema vendor.github-issue-forms .github/ISSUE_TEMPLATE/bug.yml .github/ISSUE_TEMPLATE/feature.yml .github/ISSUE_TEMPLATE/task.yml && check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml", help = "Validate the issue forms against GitHub's schemas" }
labels = { cmd = "python tools/sync_labels.py --check", help = "Validate the label files" }

[tool.poe.tasks.gate]
help = "Run before every commit: lint, format check, type-check, tests, issue forms, label files"
sequence = ["lint", "format-check", "typecheck", "test", "forms", "labels"]
default_item_type = "ref"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra -q --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "tools"
explicit_package_bases = true
